<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Opportunity X symbol">
  <title>Opportunity X — The Convergence</title>
  <!--
    Two arcs. One point.
    Each arc is a quarter-circle segment (radius 180) whose center sits
    outside the frame on the perpendicular bisector. The two arcs cross
    exactly once — at the geometric center (128,128) — forming an implicit X
    from two curved trajectories rather than two straight lines.
    The mark has 4-fold symmetry across both diagonals.
  -->
  <g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round">
    <!-- arc from top-left to bottom-right, bowing outward -->
    <path d="M 56 56 Q 128 96 200 200" />
    <path d="M 56 56 Q 96 128 200 200" opacity="0"/>
    <!-- clean version: two mirrored quadratic curves crossing at center -->
  </g>
  <g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round">
    <path d="M 56 56 C 128 96, 128 160, 200 200" />
    <path d="M 200 56 C 128 96, 128 160, 56 200" />
  </g>
  <circle cx="128" cy="128" r="8" fill="currentColor" />
</svg>
